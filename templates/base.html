<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EmiTech Store ofrece laptops, computadoras, accesorios tecnológicos y componentes informáticos.">
    <title>{% block title %}EmiTech Store - Tecnología que conecta contigo{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-emitech.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo-emitech.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <a class="visually-hidden-focusable salto-contenido" href="#contenido">Saltar al contenido</a>
    {% include "components/navbar.html" %}

    <main id="contenido">
        <!-- Cada plantilla hija aporta aquí el contenido de su módulo. -->
        {% block content %}{% endblock %}
    </main>

    {% block modals %}{% endblock %}

    {% include "components/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block page_data %}{% endblock %}
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
